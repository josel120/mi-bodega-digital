# JWT de sesión se verifica en /auth/v1/user (compatible con claves nuevas).
# El webhook verifica HMAC antes de consultar o modificar datos.
[functions.crear-preferencia]
verify_jwt = false

[functions.webhook-mercadopago]
verify_jwt = false

# Igual que crear-preferencia: verifica la sesión en /auth/v1/user y solo
# entonces borra los datos de ESE usuario con service_role.
[functions.borrar-cuenta]
verify_jwt = false

# Sin sesión: el Libro de Reclamaciones es público. Se protege con el origen,
# el código exacto de la hoja, una ventana de 1 hora y el envío único.
[functions.copia-reclamo]
verify_jwt = false
